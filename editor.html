<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>editor -wordEater</title>
<style>
body { margin:0; font-family:Arial; background:#000; color:#fff; }
.title-bar { display:flex; gap:10px; align-items:center; background:#111; padding:10px; border-bottom:1px solid #333; }
.title-bar input { padding:5px; border:1px solid #333; background:#111; color:#fff; }
.toolbar { display:flex; flex-wrap:wrap; background:#111; padding:10px; gap:5px; border-bottom:1px solid #333; }
.toolbar button, .toolbar input, .toolbar select { background:#222; color:#fff; border:1px solid #333; padding:5px 10px; cursor:pointer; }
.editor-container { display:flex; height:70vh; padding:10px; gap:10px; }
.editor, .preview { flex:1; padding:10px; border:1px solid #333; overflow-y:auto; }
.editor { background:#111; color:#fff; }
.preview { background:#222; color:#fff; }
.file-controls { display:flex; gap:10px; padding:10px; align-items:center; }
.file-controls button, .file-controls input { padding:5px 10px; background:#222; color:#fff; border:1px solid #333; cursor:pointer; }
input[type="number"] { width:70px; background:#111; color:#fff; border:1px solid #333; padding:5px; }
/* Popup styles */
#markupPopup {
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:#111;
  border:1px solid #333;
  padding:20px;
  width:70%;
  max-height:80%;
  overflow-y:auto;
  z-index:1000;
}
#markupPopup textarea {
  width:100%;
  height:300px;
  background:#222;
  color:#fff;
  border:1px solid #333;
  padding:10px;
  resize:none;
}
#markupPopup button { margin-top:10px; margin-right:5px; }
#overlay {
  display:none;
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  z-index:900;
}

.editor, .preview {
  flex:1;
  padding:10px;
  border:1px solid #333;
  overflow-y:auto;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<div class="title-bar">
  <input type="text" id="title" placeholder="Enter title here">
  <input type="number" id="fileNumber" min="0" max="9999" value="0001" placeholder="0001">
</div>

<div class="toolbar">
  <button onclick="format('bold')">Bold</button>
  <button onclick="format('italic')">Italic</button>
  <button onclick="format('underline')">Underline</button>
  <select onchange="format('justify'+this.value)">
    <option value="Left">Align Left</option>
    <option value="Center">Center</option>
    <option value="Right">Right</option>
    <option value="Full">Justify</option>
  </select>
  <input type="color" onchange="format('foreColor', this.value)">
  <select onchange="format('fontSize', this.value)">
    <option value="1">Small</option>
    <option value="3" selected>Normal</option>
    <option value="5">Large</option>
    <option value="7">Huge</option>
  </select>
  <button onclick="insertImage()">Insert Image</button>
  <button onclick="showMarkup()">Preview Markup</button>
</div>

<div class="editor-container">
  <div class="editor" contenteditable="true" oninput="updatePreview()" id="editor"></div>
  <div class="preview" id="preview"></div>
</div>

<div class="file-controls">
  <button onclick="exportText()">Export .txt</button>
  <input type="file" accept=".txt" onchange="importText(event)">
</div>

<!-- Markup popup -->
<div id="overlay"></div>
<div id="markupPopup">
  <textarea id="markupText" readonly></textarea><br>
  <button onclick="copyMarkup()">Copy to Clipboard</button>
  <button onclick="closeMarkup()">Close</button>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const titleInput = document.getElementById('title');
const fileNumberInput = document.getElementById('fileNumber');
const markupPopup = document.getElementById('markupPopup');
const markupText = document.getElementById('markupText');
const overlay = document.getElementById('overlay');

// Load saved content
if(localStorage.getItem('editorContent')) editor.innerHTML = localStorage.getItem('editorContent');
if(localStorage.getItem('editorTitle')) titleInput.value = localStorage.getItem('editorTitle');
if(localStorage.getItem('editorNumber')) fileNumberInput.value = localStorage.getItem('editorNumber');
updatePreview();

function format(command, value=null){
  document.execCommand(command,false,value);
  updatePreview();
}

function updatePreview(){
  preview.innerHTML = editor.innerHTML;
  localStorage.setItem('editorContent', editor.innerHTML);
  localStorage.setItem('editorTitle', titleInput.value);
  localStorage.setItem('editorNumber', fileNumberInput.value.padStart(4,'0'));
}

function insertImage(){
  const src = prompt('Image URL:');
  if(!src) return;
  const desc = prompt('Image description (optional):') || '';
  const html = `<div contenteditable="false">
                  <img src="${src}" alt="${desc}" style="max-width:100%;">
                  <p style="text-align:center; font-style:italic;">${desc}</p>
                </div><br>`;
  editor.innerHTML += html;
  updatePreview();
}

function exportText(){
  const number = String(fileNumberInput.value).padStart(4,'0');
  const title = titleInput.value || 'untitled';
  const filename = `${number}-${title.replace(/\s+/g,'-').toLowerCase()}.txt`;
  const date = new Date().toISOString().slice(0,19);
  const content = editor.innerHTML; // preserve markup
  const blob = new Blob([title + '\n' + date + '\n' + content], {type:'text/plain'});
  const link = document.createElement('a');
  link.download = filename;
  link.href = URL.createObjectURL(blob);
  link.click();
}

function importText(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const lines = e.target.result.split('\n');
    if(lines.length>=3){
      titleInput.value = lines[0];
      const content = lines.slice(2).join('\n');
      editor.innerHTML = content; // load markup
    } else {
      editor.innerHTML = e.target.result;
    }
    updatePreview();
  };
  reader.readAsText(file);
}

// Markup popup functions
function showMarkup(){
  markupText.value = editor.innerHTML;
  markupPopup.style.display = 'block';
  overlay.style.display = 'block';
}

function closeMarkup(){
  markupPopup.style.display = 'none';
  overlay.style.display = 'none';
}

function copyMarkup(){
  markupText.select();
  navigator.clipboard.writeText(markupText.value);
  alert('Markup copied to clipboard!');
}
</script>

</body>
</html>
