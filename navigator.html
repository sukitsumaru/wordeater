<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>navigator - wordEater</title>
<link rel="stylesheet" href="style/style.css">
<link rel="stylesheet" href="style/posts.css">
<link rel="stylesheet" href="style/mobile.css">
<link rel="stylesheet" href="style/darkmode.css">
</head>
<body>

<!-- Mobile nav -->
<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <div class="links">
      <a href="home.html">home</a>
      <a href="index.html">blog</a>
      <a href="navigator.html">navigator</a>
    </div>
    <a href="home.html" class="brand">wordeater.online</a>
    <button class="dark-mode-toggle">theme</button>
  </div>
  <div class="nav-image"></div>
</nav>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="content-box">
        <a href="mainpage.html">wordeater.online</a>
      </div>
      <div class="content-box horizontal-links">
        <a href="home.html">home</a>
        <a href="index.html">blog</a>
        <a href="navigator.html">navigator</a>
      </div>
    </div>
    <div class="sidebar-section">Sidebar 2</div>
    <div class="sidebar-section">
      <button class="dark-mode-toggle">theme</button>
    </div>
  </div>

  <!-- Main content -->
  <div class="main" style="background:black;">
    <noscript>
      <div class="post">Please enable JavaScript to see posts.</div>
    </noscript>

<div id="tree-overlay" style="display:none;">
 
  <div id="tree-container">
    <!-- Tree posts injected here -->
  </div>
</div>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Navigator controls -->
    <div id="navigator-controls">
      <button id="prev-post">Previous</button>
      <button id="next-post">Next</button>
      <button id="index-btn">Index</button>
      <button id="home-btn">Home</button>
    </div>

    <!-- Dynamic post container -->
    <div id="posts"></div>
  </div>
</div>

<script src="js/navigator.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
